# Applies to both halves. Carried over from the Toucan2 confs, minus the
# trackpad and display settings.

CONFIG_ZMK_BATTERY_REPORTING=y

# Deep sleep after 60 min idle (ZMK default is off; default timeout is 15 min).
# Waking needs a keypress and a BLE reconnect, so the longer timeout is worth
# the small extra draw. https://zmk.dev/docs/features/low-power-states
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
